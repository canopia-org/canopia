name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint e formattazione
        run: |
          npm run lint
          npm run format:check
      - name: Validazione OpenAPI
        run: npm run openapi:lint
      - name: Coerenza tra rotte e OpenAPI
        run: npm run openapi:routes
      - name: Test backend (con copertura)
        run: npm test -w backend
      - name: Test frontend
        run: npm test -w frontend
      - name: Build frontend
        run: npm run build -w frontend
